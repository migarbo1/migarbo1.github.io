<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio">
  <link rel="icon" href="assets/profile.svg">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Apply the saved theme before first paint to avoid a flash -->
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <nav class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#top" id="brand"></a>
      <div class="nav-links">
        <a href="#experience">Experience</a>
        <a href="#tech">Tech Stack</a>
        <a href="#skills">Skills</a>
        <a href="#contributions">Contributions</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle colour theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main id="top" class="container">
    <header class="hero">
      <img class="avatar" id="avatar" alt="">
      <div class="hero-text">
        <h1 id="name"></h1>
        <p class="job-title" id="job-title"></p>
        <ul class="links" id="links"></ul>
      </div>
    </header>
    <p class="phrase" id="phrase"></p>

    <section id="experience" class="section">
      <h2 data-title="experience">Experience</h2>
      <div id="experience-timeline" class="timeline"></div>
    </section>

    <section id="tech" class="section">
      <h2 data-title="tech">Technical Expertise</h2>
      <div id="tech-chart" class="tech-chart"></div>
    </section>

    <section id="skills" class="section">
      <div class="section-head">
        <h2 data-title="skills">Soft Skills</h2>
        <ul class="trophy-tally" id="trophy-tally" aria-label="Trophies by rarity"></ul>
      </div>
      <div id="skills-grid" class="skills-grid"></div>
    </section>

    <section id="contributions" class="section">
      <h2 data-title="contributions">Open Source Contributions</h2>
      <div id="contributions-grid" class="cards"></div>
    </section>
  </main>

  <footer class="footer container">
    <span id="footer-text"></span>
  </footer>

  <script src="js/main.js" type="module"></script>
</body>
</html>
